<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kubeops-agent · panel</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #f1f3f5;
      --border: #e4e7eb;
      --text: #1b1f24;
      --text-soft: #5c6670;
      --text-faint: #8b95a1;
      --accent: #2f6feb;
      --accent-soft: #e8f0fe;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
      --radius: 12px;
      --green: #18794e; --green-bg: #e6f4ec;
      --amber: #9a6700; --amber-bg: #fdf3d7;
      --red: #b42318; --red-bg: #fce9e7;
      --blue: #1f5eb8; --blue-bg: #e6effd;
      --gray: #5c6670; --gray-bg: #eceff1;
      --indigo: #5b3fb4; --indigo-bg: #ece8fb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --surface: #161a20;
        --surface-2: #1c222b;
        --border: #262d37;
        --text: #e6e9ee;
        --text-soft: #9aa4b1;
        --text-faint: #69737f;
        --accent: #5b8def;
        --accent-soft: #1b2740;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        --green: #5fd09a; --green-bg: #142a1f;
        --amber: #e8c160; --amber-bg: #2c2410;
        --red: #f08379; --red-bg: #2e1614;
        --blue: #7aa7f0; --blue-bg: #15233d;
        --gray: #9aa4b1; --gray-bg: #232a33;
        --indigo: #b4a3f0; --indigo-bg: #1f1b33;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(140%) blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .bar {
      max-width: 1100px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
    .brand .sub { color: var(--text-faint); font-size: 12px; }
    .spacer { flex: 1; }
    .meta { color: var(--text-faint); font-size: 12px; white-space: nowrap; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 18px;
    }
    .search {
      flex: 1; min-width: 180px;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
    }
    .search input { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; font-size: 14px; }
    .search svg { flex: none; color: var(--text-faint); }

    select, button, input[type="text"], input[type="number"] {
      font-family: inherit; font-size: 14px; color: var(--text);
    }
    select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); cursor: pointer;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; cursor: pointer;
      box-shadow: var(--shadow); transition: background .12s, border-color .12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.05); }
    .btn.ghost { background: transparent; box-shadow: none; }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--border)); }
    .btn.small { padding: 5px 10px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .toggle { display: inline-flex; align-items: center; gap: 8px; user-select: none; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); }
    .toggle input { accent-color: var(--accent); }

    .group { margin-bottom: 26px; }
    .group-head { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; }
    .group-head h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft); margin: 0; }
    .group-head .count { color: var(--text-faint); font-size: 12px; }
    .group-head .rule { flex: 1; height: 1px; background: var(--border); }

    .cards { display: grid; gap: 10px; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 14px 16px;
    }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .card-name { font-weight: 600; font-size: 15px; letter-spacing: -.01em; word-break: break-all; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .card-actions { margin-left: auto; display: flex; gap: 8px; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 550; padding: 3px 9px; border-radius: 999px;
      background: var(--gray-bg); color: var(--gray); white-space: nowrap;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.amber { background: var(--amber-bg); color: var(--amber); }
    .badge.red { background: var(--red-bg); color: var(--red); }
    .badge.blue { background: var(--blue-bg); color: var(--blue); }
    .badge.gray { background: var(--gray-bg); color: var(--gray); }
    .badge.indigo { background: var(--indigo-bg); color: var(--indigo); }

    .card-meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--text-soft); font-size: 12.5px; }
    .card-meta .kv { display: inline-flex; gap: 6px; align-items: baseline; }
    .card-meta .k { color: var(--text-faint); }
    .card-meta .v { color: var(--text); font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

    .statusmsg {
      margin-top: 10px; padding: 9px 11px; border-radius: 8px;
      background: var(--red-bg); color: var(--red);
      font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
      border: 1px solid color-mix(in srgb, var(--red) 22%, transparent);
    }
    .statusmsg .label { font-weight: 600; }

    .empty, .loading {
      text-align: center; color: var(--text-faint);
      padding: 60px 20px; border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .empty strong { display: block; color: var(--text-soft); margin-bottom: 4px; font-weight: 600; }

    .spin { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -4px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(8, 11, 16, .45);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
      width: 100%; max-width: 420px; padding: 20px;
    }
    .modal h3 { margin: 0 0 4px; font-size: 16px; }
    .modal p.hint { margin: 0 0 16px; color: var(--text-soft); font-size: 13px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12.5px; color: var(--text-soft); margin-bottom: 5px; font-weight: 550; }
    .field input[type="text"], .field input[type="number"] {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px; outline: 0;
    }
    .field input:focus { border-color: var(--accent); }
    .field.check { display: flex; align-items: center; gap: 8px; }
    .field.check input { accent-color: var(--accent); }
    .field.check label { margin: 0; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

    /* Toasts */
    .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--gray); border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 10px 14px; min-width: 240px; max-width: 380px;
      font-size: 13px; animation: slidein .18s ease;
    }
    .toast.ok { border-left-color: var(--green); }
    .toast.err { border-left-color: var(--red); }
    .toast.info { border-left-color: var(--blue); }
    .toast .t-title { font-weight: 600; margin-bottom: 1px; }
    .toast .t-body { color: var(--text-soft); word-break: break-word; }
    @keyframes slidein { from { opacity: 0; transform: translateY(6px); } }

    @media (max-width: 560px) {
      .card-actions { margin-left: 0; width: 100%; }
      .card-top { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <h1>kubeops-agent</h1>
        <span class="sub">panel de control</span>
      </div>
      <div class="spacer"></div>
      <span class="meta" id="meta"></span>
      <label class="toggle" title="Refrescar automáticamente cada 15s">
        <input type="checkbox" id="autorefresh" checked />
        auto
      </label>
      <button class="btn small" id="refreshBtn" title="Refrescar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refrescar
      </button>
      <button class="btn small" id="tokenBtn" title="Configurar token de API">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Token
      </button>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Buscar app o repositorio…" autocomplete="off" />
      </label>
      <select id="envFilter"><option value="">Todos los entornos</option></select>
      <label class="toggle">
        <input type="checkbox" id="onlyProblems" />
        Solo con problemas
      </label>
    </div>

    <div id="content"></div>
  </main>

  <!-- Lock modal -->
  <div class="overlay" id="lockOverlay">
    <div class="modal">
      <h3>Bloquear aplicación</h3>
      <p class="hint" id="lockHint"></p>
      <div class="field">
        <label for="lockBranch">Branch destino</label>
        <input type="text" id="lockBranch" placeholder="feature/mi-rama" />
      </div>
      <div class="field">
        <label for="lockPr">Pull request id (opcional)</label>
        <input type="number" id="lockPr" value="0" min="0" />
      </div>
      <div class="field check">
        <input type="checkbox" id="lockForce" />
        <label for="lockForce">Forzar (sobrescribir un bloqueo existente)</label>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close="lockOverlay">Cancelar</button>
        <button class="btn primary" id="lockConfirm">Bloquear</button>
      </div>
    </div>
  </div>

  <!-- Token modal -->
  <div class="overlay" id="tokenOverlay">
    <div class="modal">
      <h3>Token de API</h3>
      <p class="hint">Se envía como <span class="mono">Authorization: Bearer …</span> en cada petición y se guarda en este navegador (localStorage). Déjalo vacío si el servidor no requiere autenticación.</p>
      <div class="field">
        <label for="tokenInput">API token</label>
        <input type="text" id="tokenInput" placeholder="(sin token)" autocomplete="off" spellcheck="false" />
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close="tokenOverlay">Cancelar</button>
        <button class="btn primary" id="tokenSave">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    "use strict";

    // ── API client ──────────────────────────────────────────────────────────
    // URLs are relative to the document so a configured CONTEXT_ROOT just works.
    const TOKEN_KEY = "kubeops.apiToken";

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
    function setToken(t) {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }

    function apiURL(path) { return new URL(path, window.location.href).toString(); }

    async function api(path, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(apiURL(path), Object.assign({}, options, { headers }));
      if (res.status === 401) {
        openModal("tokenOverlay");
        toast("err", "No autorizado", "Revisa el API token.");
        throw new Error("unauthorized");
      }
      return res;
    }

    async function readError(res) {
      try { return (await res.text()).trim() || ("HTTP " + res.status); }
      catch { return "HTTP " + res.status; }
    }

    // ── Status presentation ─────────────────────────────────────────────────
    function statusClass(status) {
      switch ((status || "").toLowerCase()) {
        case "healthy":
        case "synced":      return "green";
        case "progressing": return "blue";
        case "outofsync":   return "amber";
        case "degraded":
        case "missing":     return "red";
        case "suspended":   return "gray";
        default:            return "gray";
      }
    }
    function isProblem(app) {
      const s = (app.status || "").toLowerCase();
      return s !== "" && s !== "healthy" && s !== "synced";
    }

    // ── Rendering ─────────────────────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);
    let allApps = [];

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function repoShort(url) {
      if (!url) return "";
      return url.replace(/^https?:\/\//, "").replace(/\.git$/, "");
    }

    function applyFilters(apps) {
      const q = $("search").value.trim().toLowerCase();
      const env = $("envFilter").value;
      const onlyProblems = $("onlyProblems").checked;
      return apps.filter((a) => {
        if (env && a.environment !== env) return false;
        if (onlyProblems && !isProblem(a)) return false;
        if (q) {
          const hay = (a.name + " " + (a.repository || "") + " " + (a.branch || "")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function render() {
      const content = $("content");
      const apps = applyFilters(allApps);

      if (allApps.length === 0) {
        content.innerHTML = '<div class="empty"><strong>No hay aplicaciones</strong>El agente no devolvió ninguna app. Verifica el cluster y el token.</div>';
        return;
      }
      if (apps.length === 0) {
        content.innerHTML = '<div class="empty"><strong>Sin resultados</strong>Ninguna app coincide con los filtros actuales.</div>';
        return;
      }

      // Group by environment, sorted; apps sorted by name within each group.
      const groups = {};
      for (const a of apps) {
        const k = a.environment || "sin entorno";
        (groups[k] = groups[k] || []).push(a);
      }
      const envNames = Object.keys(groups).sort();

      let html = "";
      for (const env of envNames) {
        const list = groups[env].sort((x, y) => x.name.localeCompare(y.name));
        html += '<section class="group">';
        html += '<div class="group-head"><h2>' + esc(env) + '</h2><span class="count">' + list.length + '</span><span class="rule"></span></div>';
        html += '<div class="cards">';
        for (const a of list) html += cardHTML(a);
        html += '</div></section>';
      }
      content.innerHTML = html;
      bindCardActions();
    }

    function cardHTML(a) {
      const statusBadge = a.status
        ? '<span class="badge ' + statusClass(a.status) + '"><span class="dot"></span>' + esc(a.status) + '</span>'
        : '<span class="badge gray"><span class="dot"></span>sin estado</span>';

      const lockBadge = a.locked
        ? '<span class="badge indigo">🔒 bloqueada' + (a.pull_request_id > 0 ? ' · PR ' + a.pull_request_id : '') + '</span>'
        : '<span class="badge">desbloqueada</span>';

      const id = encodeURIComponent(a.name);
      const actions = a.locked
        ? '<button class="btn small danger" data-unlock="' + esc(a.name) + '">Desbloquear</button>'
        : '<button class="btn small" data-lock="' + esc(a.name) + '">Bloquear</button>';

      let meta = '';
      const kv = (k, v) => '<span class="kv"><span class="k">' + k + '</span><span class="v mono">' + esc(v) + '</span></span>';
      if (a.repository) meta += '<span class="kv"><span class="k">repo</span><a class="v" href="' + esc(a.repository.replace(/\.git$/, "")) + '" target="_blank" rel="noopener">' + esc(repoShort(a.repository)) + '</a></span>';
      if (a.branch) meta += kv("branch", a.branch);
      if (a.cluster) meta += kv("cluster", a.cluster);

      const msg = a.status_message
        ? '<div class="statusmsg"><span class="label">Error de sincronización:</span> ' + esc(a.status_message) + '</div>'
        : '';

      return '<article class="card">'
        + '<div class="card-top">'
        +   '<span class="card-name">' + esc(a.name) + '</span>'
        +   '<div class="badges">' + statusBadge + lockBadge + '</div>'
        +   '<div class="card-actions">' + actions + '</div>'
        + '</div>'
        + '<div class="card-meta">' + meta + '</div>'
        + msg
        + '</article>';
    }

    function bindCardActions() {
      document.querySelectorAll("[data-lock]").forEach((b) =>
        b.addEventListener("click", () => openLock(b.getAttribute("data-lock"))));
      document.querySelectorAll("[data-unlock]").forEach((b) =>
        b.addEventListener("click", () => doUnlock(b.getAttribute("data-unlock"))));
    }

    function populateEnvFilter() {
      const sel = $("envFilter");
      const current = sel.value;
      const envs = Array.from(new Set(allApps.map((a) => a.environment || "sin entorno"))).sort();
      sel.innerHTML = '<option value="">Todos los entornos</option>' +
        envs.map((e) => '<option value="' + esc(e) + '">' + esc(e) + '</option>').join("");
      if (envs.includes(current)) sel.value = current;
    }

    // ── Data loading ──────────────────────────────────────────────────────────
    let loading = false;
    async function load(showSpinner) {
      if (loading) return;
      loading = true;
      if (showSpinner && allApps.length === 0) {
        $("content").innerHTML = '<div class="loading"><span class="spin"></span> Cargando aplicaciones…</div>';
      }
      try {
        const res = await api("api/v1/apps");
        if (!res.ok) {
          const msg = await readError(res);
          if (allApps.length === 0) {
            $("content").innerHTML = '<div class="empty"><strong>No se pudo cargar</strong>' + esc(msg) + '</div>';
          } else {
            toast("err", "Error al refrescar", msg);
          }
          return;
        }
        allApps = await res.json();
        populateEnvFilter();
        render();
        const probs = allApps.filter(isProblem).length;
        $("meta").textContent = allApps.length + " apps" + (probs ? " · " + probs + " con problemas" : "");
      } catch (e) {
        if (e.message !== "unauthorized") {
          if (allApps.length === 0) {
            $("content").innerHTML = '<div class="empty"><strong>Error de red</strong>' + esc(e.message) + '</div>';
          } else {
            toast("err", "Error de red", e.message);
          }
        }
      } finally {
        loading = false;
      }
    }

    // ── Lock / unlock ─────────────────────────────────────────────────────────
    let lockTarget = null;
    function openLock(name) {
      const app = allApps.find((a) => a.name === name);
      if (!app) return;
      lockTarget = name;
      $("lockHint").textContent = "Apunta «" + name + "» a una branch y la bloquea para impedir merges.";
      $("lockBranch").value = app.branch || "";
      $("lockPr").value = "0";
      $("lockForce").checked = false;
      openModal("lockOverlay");
      setTimeout(() => $("lockBranch").focus(), 50);
    }

    async function doLock() {
      const name = lockTarget;
      if (!name) return;
      const branch = $("lockBranch").value.trim();
      if (!branch) { toast("err", "Falta la branch", "Indica la branch destino."); return; }
      const pr = parseInt($("lockPr").value, 10) || 0;
      const force = $("lockForce").checked;
      const btn = $("lockConfirm");
      btn.disabled = true;
      try {
        const path = "api/v1/apps/" + encodeURIComponent(name) + "/lock" + (force ? "?force=true" : "");
        const res = await api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ branch: branch, pull_request_id: pr }),
        });
        if (!res.ok) { toast("err", "No se pudo bloquear", await readError(res)); return; }
        closeModal("lockOverlay");
        toast("ok", "Aplicación bloqueada", name + " → " + branch);
        await load(false);
      } catch (e) {
        if (e.message !== "unauthorized") toast("err", "Error", e.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function doUnlock(name) {
      if (!confirm("¿Desbloquear «" + name + "» y restaurar su branch anterior?")) return;
      try {
        const res = await api("api/v1/apps/" + encodeURIComponent(name) + "/unlock", { method: "POST" });
        if (!res.ok) { toast("err", "No se pudo desbloquear", await readError(res)); return; }
        toast("ok", "Aplicación desbloqueada", name);
        await load(false);
      } catch (e) {
        if (e.message !== "unauthorized") toast("err", "Error", e.message);
      }
    }

    // ── Modals ──────────────────────────────────────────────────────────────
    function openModal(id) { $(id).classList.add("open"); }
    function closeModal(id) { $(id).classList.remove("open"); }
    document.querySelectorAll("[data-close]").forEach((b) =>
      b.addEventListener("click", () => closeModal(b.getAttribute("data-close"))));
    document.querySelectorAll(".overlay").forEach((o) =>
      o.addEventListener("click", (e) => { if (e.target === o) o.classList.remove("open"); }));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.querySelectorAll(".overlay.open").forEach((o) => o.classList.remove("open"));
    });

    // ── Toasts ──────────────────────────────────────────────────────────────
    function toast(kind, title, body) {
      const el = document.createElement("div");
      el.className = "toast " + (kind || "info");
      el.innerHTML = '<div class="t-title">' + esc(title) + '</div>' + (body ? '<div class="t-body">' + esc(body) + '</div>' : '');
      $("toasts").appendChild(el);
      setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 4200);
      setTimeout(() => el.remove(), 4600);
    }

    // ── Wiring ──────────────────────────────────────────────────────────────
    $("refreshBtn").addEventListener("click", () => load(true));
    $("search").addEventListener("input", render);
    $("envFilter").addEventListener("change", render);
    $("onlyProblems").addEventListener("change", render);
    $("lockConfirm").addEventListener("click", doLock);
    $("lockBranch").addEventListener("keydown", (e) => { if (e.key === "Enter") doLock(); });

    $("tokenBtn").addEventListener("click", () => {
      $("tokenInput").value = getToken();
      openModal("tokenOverlay");
      setTimeout(() => $("tokenInput").focus(), 50);
    });
    $("tokenSave").addEventListener("click", () => {
      setToken($("tokenInput").value.trim());
      closeModal("tokenOverlay");
      toast("info", "Token guardado");
      load(true);
    });
    $("tokenInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("tokenSave").click(); });

    // Auto-refresh every 15s when enabled and the tab is visible.
    let timer = null;
    function scheduleRefresh() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        if ($("autorefresh").checked && document.visibilityState === "visible") load(false);
      }, 15000);
    }
    $("autorefresh").addEventListener("change", scheduleRefresh);

    // Boot.
    scheduleRefresh();
    load(true);
  </script>
</body>
</html>
