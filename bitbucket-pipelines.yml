---
options:
  docker: true
  max-time: 10
  size: 2x
  runtime:
    cloud:
      version: 3


definitions:
  services:
    docker:
      memory: 4096

image:
  name: 234166862235.dkr.ecr.eu-south-2.amazonaws.com/pipeline:docker
  aws:
    access-key: $BITBUCKET_AWS_ACCESS_KEY_ID
    secret-key: $BITBUCKET_AWS_SECRET_ACCESS_KEY


pipelines:
  branches:
    dev:
    - step:
        name: Build && Publish
        caches: ["docker"]
        services: ["docker"]
        script:
        - |
            export DOCKER_BUILDKIT=1
            export REPOSITORY="234166862235.dkr.ecr.eu-south-2.amazonaws.com"
            export IMAGE="gitops-bot"
            export TAG="dev"
        - |
            export AWS_ACCESS_KEY_ID=${BITBUCKET_AWS_ACCESS_KEY_ID}
            export AWS_SECRET_ACCESS_KEY=${BITBUCKET_AWS_SECRET_ACCESS_KEY}
            aws ecr get-login-password --region eu-south-2 | docker login --username AWS --password-stdin ${REPOSITORY}
        - |
            # buildx needs a container-driver builder to build multiple platforms at once.
            docker buildx create --use --name multiarch --driver docker-container
            # Cross-compiled per platform in the Containerfile; --push uploads one manifest-list tag.
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Containerfile \
              -t ${REPOSITORY}/${IMAGE}:${TAG} \
              --push .
