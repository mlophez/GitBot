---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitbot-reconcile
  labels:
    app.kubernetes.io/name: gitbot
spec:
  # Reconcile orphaned locks every 15 minutes: unlock apps whose PR is no longer open.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitbot
        spec:
          serviceAccountName: gitbot
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 30000
            runAsUser: 30000
            runAsGroup: 30000
            runAsNonRoot: true
          containers:
            - name: reconcile
              image: docker.io/lgtjpmora/gitbot:dev
              imagePullPolicy: Always
              command: ["/app/reconcile"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - secretRef:
                    name: gitbot
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 128Mi
